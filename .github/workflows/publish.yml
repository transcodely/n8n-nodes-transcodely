# Publishes n8n-nodes-transcodely to npm when a version tag is pushed.
#
# Since 2026-05-01 n8n requires community nodes to be published from a GitHub
# Action carrying an npm provenance statement, which is what `--provenance`
# plus the `id-token: write` permission below produce.
#
# The release itself is prepared locally and this workflow only publishes what
# the tag points at — see RELEASING.md. Nothing here is interactive, and
# nothing here bumps a version or creates a tag.
#
# ONE-TIME SETUP (maintainer), pick one:
#   A. Trusted Publishing (recommended, no secret in the repository):
#      npmjs.com -> the package -> Settings -> Publish access ->
#      Trusted Publishers -> Add: GitHub Actions, owner "transcodely",
#      repository "n8n-nodes-transcodely", workflow "publish.yml",
#      environment blank. Leave NPM_TOKEN unset; npm exchanges the OIDC token.
#   B. A granular npm access token with publish rights on this package, stored
#      as the NPM_TOKEN repository secret. Provenance still applies.

name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint the OIDC token npm uses for Trusted Publishing and for
      # the provenance attestation.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Use an npm that supports Trusted Publishing
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Verification scan
        run: npm run scan

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm publish --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
